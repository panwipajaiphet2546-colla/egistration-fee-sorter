<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.jpg">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>คัดแยกค่าลงทะเบียน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: college-maroon top bar → manage card (roster + finance upload) → 4 stat cards → filters → paged student ledger */
:root{
  --bg:#f5f2f3; --surface:#ffffff; --surface-2:#f7f0f2; --line:#e8dde1; --fg:#241a1e; --muted:#6c5f64;
  --bar:#9b1b38; --bar-fg:#ffffff; --brand:#9b1b38; --brand-fg:#ffffff; --brand-soft:#f9e7eb;
  --ok:#15804b; --ok-soft:#dcf3e6; --warn:#a46200; --warn-soft:#fdf1d6; --bad:#c2272e; --bad-soft:#fde5e5; --info:#2d58cf; --info-soft:#e4ebfd;
  --display:"Anuphan","IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  --body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  --mono:"IBM Plex Mono","Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141013; --surface:#1d171a; --surface-2:#261e22; --line:#3a2d33; --fg:#efe6e9; --muted:#b2a4a9;
  --bar:#5e1225; --bar-fg:#fbeef1; --brand:#e2728c; --brand-fg:#1d0b10; --brand-soft:#3a1d25;
  --ok:#55c890; --ok-soft:#14352a; --warn:#f0b04f; --warn-soft:#3a2b12; --bad:#ff8a84; --bad-soft:#3f1b1b; --info:#8eaaff; --info-soft:#1f2a4c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141013; --surface:#1d171a; --surface-2:#261e22; --line:#3a2d33; --fg:#efe6e9; --muted:#b2a4a9;
  --bar:#5e1225; --bar-fg:#fbeef1; --brand:#e2728c; --brand-fg:#1d0b10; --brand-soft:#3a1d25;
  --ok:#55c890; --ok-soft:#14352a; --warn:#f0b04f; --warn-soft:#3a2b12; --bad:#ff8a84; --bad-soft:#3f1b1b; --info:#8eaaff; --info-soft:#1f2a4c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
svg.i{width:1.05em;height:1.05em;vertical-align:-.15em;flex:none}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.bar{background:var(--bar);color:var(--bar-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar-in{max-width:1240px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:50%;background:#ffffff;object-fit:cover;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.bar h1{font-size:1.2rem;font-weight:700;flex:1;min-width:0}
.bar h1 small{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;opacity:.85}
.mode-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-size:.85rem;white-space:nowrap}
.mode-chip i{width:8px;height:8px;border-radius:50%;background:#9be2b8;display:inline-block}
.mode-chip.warn i{background:#ffd27a} .mode-chip.bad i{background:#ff9d9d}

.wrap{max-width:1240px;margin:0 auto;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.pad{padding:18px 20px}
.manage{border-left:4px solid var(--ok)}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.card-head h2{font-size:1.15rem;display:flex;gap:8px;align-items:center}
.card-head h2 svg{color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}

.btn{font:inherit;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.btn.primary{background:var(--info);border-color:var(--info);color:var(--surface)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.soft-bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.big{padding:11px 20px;font-size:1rem}
.btn.small{padding:4px 10px;font-size:.85rem}
.icon-btn{font:inherit;width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.icon-btn.edit{color:var(--info);background:var(--info-soft);border-color:transparent}
.icon-btn.del{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.icon-btn:focus-visible{outline:2px solid var(--info);outline-offset:2px}

.upload{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.upload-title{font-weight:600;display:flex;gap:8px;align-items:center}
.upload-row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.filebox{flex:1;min-width:240px;display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;overflow:hidden}
.filebox.over{border-color:var(--info);background:var(--info-soft)}
.filebox input{position:absolute;width:1px;height:1px;opacity:0}
.filebox:focus-within{outline:2px solid var(--info);outline-offset:2px}
.filebtn{background:var(--ok-soft);color:var(--ok);font-weight:600;padding:10px 16px;border-right:1px solid var(--line);white-space:nowrap}
.filename{padding:10px 14px;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.filename.has{color:var(--fg);font-weight:500}
.fineprint{margin:0;font-size:.8rem;color:var(--muted)}
.preview{font-size:.9rem;background:var(--info-soft);border-radius:8px;padding:9px 12px}
.preview.err{background:var(--bad-soft);color:var(--bad)}
.preview.okk{background:var(--ok-soft);color:var(--fg)}
details.adjust summary{cursor:pointer;font-size:.85rem;color:var(--info);width:max-content;max-width:100%}
details.adjust[open] summary{margin-bottom:10px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.field{display:grid;gap:3px;min-width:0}
.field label{font-size:.8rem;color:var(--muted)}
.field label .req{color:var(--bad)}
.field.span2{grid-column:span 2}
select,input[type=number],input[type=search],input[type=text],textarea{font:inherit;font-size:.92rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.map-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted);margin-top:8px}
.import{margin-top:14px;border:1px dashed var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.modes{display:grid;gap:6px}
.modes label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.modes input{margin-top:5px}

.sample-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:10px;padding:10px 14px;font-size:.9rem}
.sample-bar strong{color:var(--warn)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat .k{font-size:.88rem;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--info-soft);color:var(--info);flex:none}
.stat.ok{border-left-color:var(--ok)} .stat.ok .v{color:var(--ok)} .stat.ok .ic{background:var(--ok-soft);color:var(--ok)}
.stat.warn{border-left-color:var(--warn)} .stat.warn .v{color:var(--warn)} .stat.warn .ic{background:var(--warn-soft);color:var(--warn)}
.stat.bad{border-left-color:var(--bad)} .stat.bad .v{color:var(--bad)} .stat.bad .ic{background:var(--bad-soft);color:var(--bad)}
.stat .sub{font-size:.8rem;color:var(--muted)}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px;align-items:end}
.listbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.pager{display:flex;gap:6px;align-items:center;font-size:.9rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;font-size:.85rem;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tbody tr:hover{background:var(--surface-2)}
td .id{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.room{display:inline-block;margin-top:3px;font-size:.78rem;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--muted)}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-size:.82rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.rc{font-size:.84rem;line-height:1.45}
.rc b{font-family:var(--mono);font-weight:500}
.acts{display:flex;gap:8px;justify-content:center}
.empty{padding:36px 18px;color:var(--muted);text-align:center;display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-size:1.05rem}
.bar-mini{display:flex;align-items:center;gap:8px;min-width:130px}
.bar-mini i{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:block;border:1px solid var(--line)}
.bar-mini i b{display:block;height:100%;background:var(--ok)}
.bar-mini span{font-variant-numeric:tabular-nums;min-width:44px;text-align:right;font-size:.85rem}
tr.total td{font-weight:600;background:var(--surface-2)}

.overlay{position:fixed;inset:0;background:rgba(20,10,14,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:1.15rem} .modal h3{font-size:.95rem;color:var(--muted);font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.m-err{margin:0;color:var(--bad);font-size:.88rem;min-height:1.2em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}.field.span2{grid-column:auto}.stat .v{font-size:1.6rem}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <img class="logo" src="logo.jpg" width="48" height="48" alt="ตราวิทยาลัยเทคนิคอุบลราชธานี">
    <h1>ระบบตรวจสอบการชำระค่าลงทะเบียน<small>งานทะเบียน วิทยาลัยเทคนิคอุบลราชธานี</small></h1>
    <span class="mode-chip" id="modeChip"><i></i><span>กำลังเชื่อมต่อ…</span></span>
  </div>
</header>

<main class="wrap">
  <div class="sample-bar" id="sampleBar" hidden>
    <span><strong>กำลังแสดงข้อมูลตัวอย่าง</strong> รายชื่อ สถานะ และยอดเงินด้านล่างเป็นข้อมูลสมมติ ไม่ได้บันทึก</span>
    <button class="btn small" id="clearSample" type="button">ปิดข้อมูลตัวอย่าง</button>
  </div>

  <section class="card pad manage" aria-label="จัดการฐานข้อมูลนักศึกษา">
    <div class="card-head">
      <h2><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>จัดการฐานข้อมูลนักศึกษา</h2>
      <div class="row" id="manageBtns">
        <button class="btn soft-bad" type="button" id="clearBtn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>ล้างข้อมูล</button>
        <button class="btn" type="button" id="openImport"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M7 8l5-5 5 5M4 15v5h16v-5"/></svg>นำเข้ารายชื่อจาก RMS</button>
        <button class="btn primary" type="button" id="addBtn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>เพิ่มนักศึกษาใหม่</button>
      </div>
    </div>

    <div class="import" id="importBox" hidden>
      <strong>นำเข้ารายชื่อนักศึกษา</strong>
      <label class="filebox" id="drop-master">
        <input type="file" id="file-master" accept=".xlsx,.xls,.csv" multiple>
        <span class="filebtn">เลือกไฟล์</span>
        <span class="filename" id="name-master">รายงานรายชื่อแยกตามกลุ่มจาก RMS เลือกได้หลายไฟล์พร้อมกัน (ปวช.1 ถึง ปวส.2)</span>
      </label>
      <div id="map-master"></div>
      <div class="modes" id="modes" hidden>
        <label><input type="radio" name="mode" value="replace" id="mode-replace" checked><span><b>แทนที่รายชื่อเดิมทั้งหมด</b><br><span class="muted">ใช้ตอนขึ้นปีการศึกษาใหม่ ไฟล์ต้องมีนักศึกษาครบทุกคน สถานะชำระเงินของคนที่ยังอยู่จะไม่หาย</span></span></label>
        <label><input type="radio" name="mode" value="merge" id="mode-merge"><span><b>เพิ่มคนใหม่และอัปเดตคนที่มีอยู่</b><br><span class="muted">จับคู่ด้วยรหัสนักศึกษา คนที่ไม่อยู่ในไฟล์ยังคงอยู่ในฐานข้อมูล</span></span></label>
      </div>
      <div id="importPreview"></div>
      <div class="row">
        <button class="btn ok" id="saveRoster" type="button" disabled>บันทึกลงฐานข้อมูล</button>
        <button class="btn" id="cancelImport" type="button">ยกเลิก</button>
      </div>
    </div>

    <div class="upload">
      <div class="upload-title"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13l2 2 4-4"/></svg>อัปเดตสถานะชำระเงินจากไฟล์ Excel ของฝ่ายการเงิน</div>
      <div class="upload-row">
        <label class="filebox" id="drop-fin">
          <input type="file" id="file-fin" accept=".xlsx,.xls,.csv">
          <span class="filebtn">เลือกไฟล์</span>
          <span class="filename" id="name-fin">ไม่ได้เลือกไฟล์ใด</span>
        </label>
        <button class="btn ok big" type="button" id="processBtn" disabled><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></svg>ประมวลผลอัปเดตข้อมูล</button>
      </div>
      <div id="finPreview"></div>
      <p class="fineprint" id="storeNote"></p>
    </div>
  </section>

  <section class="stats" id="stats" aria-label="สรุปจำนวน"></section>

  <section class="card pad" aria-label="ตัวกรอง">
    <div class="filters">
      <div class="field"><label for="f-level">ชั้นปี</label><select id="f-level"></select></div>
      <div class="field"><label for="f-dept">สาขาวิชา</label><select id="f-dept"></select></div>
      <div class="field"><label for="f-q">ค้นหา ชื่อ / รหัส / ห้อง</label><input type="search" id="f-q" placeholder="พิมพ์ค้นหา…"></div>
      <div class="field"><label for="f-st">สถานะชำระเงิน</label><select id="f-st"><option value="">— ทั้งหมด —</option><option value="paid">ชำระแล้ว</option><option value="deferred">ผ่อนผัน</option><option value="unpaid">ยังไม่ชำระ</option></select></div>
      <button class="btn brand big" type="button" id="summaryBtn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>สรุป / Excel</button>
    </div>
  </section>

  <section class="card pad" id="summaryCard" hidden aria-label="สรุปตามระดับชั้นและสาขา"></section>

  <div class="listbar">
    <span id="countLine">&nbsp;</span>
    <div class="pager" id="pager"></div>
  </div>
  <section class="card" aria-label="รายชื่อนักศึกษา">
    <div class="scroll" id="tableBox"></div>
  </section>

  <section class="card pad" id="unmatchedCard" hidden aria-label="รายการที่ไม่พบในรายชื่อ"></section>
</main>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>
<datalist id="dl-level"></datalist><datalist id="dl-dept"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const thCmp = (a,b) => String(a).localeCompare(String(b),'th',{numeric:true});
const fmtDate = iso => { try { return new Date(iso).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}); } catch(e){ return ''; } };

/* Department names that mean the same department. Left side as it appears in the file, right side the name to use. */
const DEPT_ALIASES = {
  'ช่างไฟฟ้า': 'ไฟฟ้า',
  'บัญชี': 'การบัญชี'
};
/* "บัญชี 1/3" → "บัญชี" (the class number is already in the group), then apply aliases */
function normDept(d){
  const s = String(d || '').replace(/\s+/g,' ').trim().replace(/\s+\d+\s*\/\s*\d+$/,'').trim();
  return DEPT_ALIASES[s] || s;
}
const MATCH_LABEL = {id:'รหัสนักศึกษา', nid:'เลขประจำตัวประชาชน', name:'ชื่อ-สกุล'};

/* ---------- parsing ---------- */
const cellStr = v => {
  if (v === null || v === undefined) return '';
  if (v instanceof Date) return v.toLocaleDateString('th-TH',{dateStyle:'medium'});
  return String(v).trim();
};
function readWorkbook(buf){
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const sheets = {};
  wb.SheetNames.forEach(n => {
    sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:'', raw:true, blankrows:false}).map(r => r.map(cellStr));
  });
  return {sheetNames: wb.SheetNames, sheets};
}
const KEYWORDS = /รหัส|ชื่อ|สกุล|ระดับ|ชั้น|สาขา|แผนก|ช่าง|กลุ่ม|จำนวน|เงิน|ยอด|ลำดับ|เลขที่|วันที่|ใบเสร็จ|id|name/i;
function detectHeader(aoa){
  let best = -1, bestScore = 1;
  for (let i = 0; i < Math.min(aoa.length, 25); i++){
    const score = aoa[i].filter(c => c && c.length < 40 && KEYWORDS.test(c)).length;
    if (score > bestScore){ best = i; bestScore = score; }
  }
  if (best >= 0) return best;
  const i = aoa.findIndex(r => r.filter(Boolean).length >= 2);
  return i < 0 ? 0 : i;
}
function pick(headers, tests, exclude){
  for (const t of tests){
    const i = headers.findIndex(h => t.test(h) && !(exclude && exclude.test(h)));
    if (i >= 0) return i;
  }
  return -1;
}
function autoMap(kind, headers){
  const m = {};
  m.id = pick(headers, [/รหัส.*(นัก|ประจำตัว)|เลขประจำตัว(?!ประชาชน)|student.?id/i, /รหัส/i, /^id$/i], /วิชา|สาขา|กลุ่ม|แผนก|ไปรษณีย์|บัตร|ประชาชน/);
  m.nid = pick(headers, [/ประชาชน|เลขบัตร|citizen/i]);
  m.name = pick(headers, [/ชื่อ.*สกุล/, /^ชื่อ$|ชื่อนัก|^ชื่อ/, /name/i], /สาขา|วิชา|กลุ่ม|ผู้รับ|ผู้ปกครอง|บิดา|มารดา/);
  if (kind === 'fin'){
    m.amount = pick(headers, [/จำนวนเงิน|ยอดเงิน|ยอดชำระ/, /เงิน|ยอด|amount/i]);
    m.rc = pick(headers, [/ใบเสร็จ|receipt/i]);
    m.dt = pick(headers, [/ลงวันที่|วันที่ชำระ|วันที่|date/i]);
  } else {
    m.surname = (m.name >= 0 && /สกุล/.test(headers[m.name])) ? -1 : pick(headers, [/นามสกุล|^สกุล/]);
    m.level = pick(headers, [/ระดับชั้น|ชั้นปี/, /ระดับ|ชั้น|level/i]);
    m.dept = pick(headers, [/สาขาวิชา|สาขางาน|แผนกวิชา/, /สาขา|แผนก|ช่าง|major/i], /รหัส/);
    m.group = pick(headers, [/กลุ่มเรียน/, /กลุ่ม|ห้อง/], /รหัส/);
    m.type = pick(headers, [/ประเภทผู้เรียน|ประเภท/]);
  }
  return m;
}
function makeSource(kind, fileName, wbData){
  const sheet = wbData.sheetNames.find(n => (wbData.sheets[n] || []).length) || wbData.sheetNames[0];
  const src = {fileName, ...wbData, sheet, headerRow:0, map:{}};
  applySheet(kind, src, sheet);
  return src;
}
function applySheet(kind, src, sheet){
  src.sheet = sheet;
  src.headerRow = detectHeader(src.sheets[sheet] || []);
  src.map = autoMap(kind, headersOf(src));
}
function headersOf(src){
  const aoa = src.sheets[src.sheet] || [];
  const row = aoa[src.headerRow] || [];
  const width = Math.max(row.length, ...aoa.slice(src.headerRow, src.headerRow + 30).map(r => r.length), 0);
  return Array.from({length: width}, (_, i) => row[i] || ('คอลัมน์ ' + XLSX.utils.encode_col(i)));
}
function dataRows(src){
  return (src.sheets[src.sheet] || []).slice(src.headerRow + 1).map((r, i) => ({r, line: src.headerRow + 2 + i})).filter(o => o.r.some(Boolean));
}
/* Finance files often keep one sheet per payment day: stack every sheet that has a usable header into one table */
function makeFinSource(fileName, wbData){
  const parts = [];
  wbData.sheetNames.forEach(n => {
    const aoa = wbData.sheets[n] || [];
    if (!aoa.length) return;
    const tmp = {sheets: wbData.sheets, sheetNames: wbData.sheetNames, sheet: n, headerRow: detectHeader(aoa)};
    const m = autoMap('fin', headersOf(tmp));
    if (m.id < 0 && m.name < 0 && m.nid < 0) return;
    parts.push({n, tmp, m});
  });
  if (parts.length < 2) return makeSource('fin', fileName, wbData);
  const rows = [['ชีต','แถว','รหัสประจำตัว','เลขประจำตัวประชาชน','ชื่อ-สกุล','จำนวนเงิน','เลขที่ใบเสร็จ','ลงวันที่']];
  parts.forEach(({n, tmp, m}) => dataRows(tmp).forEach(({r, line}) => {
    const g = k => m[k] >= 0 ? (r[m[k]] ?? '') : '';
    let dt = String(g('dt')).trim();
    if (!dt || /^\d+(\.\d+)?$/.test(dt)) dt = n.trim();   // numbers in the date column are not readable dates: use the sheet (payment day) name
    rows.push([n.trim(), String(line), g('id'), g('nid'), g('name'), g('amount'), g('rc'), dt]);
  }));
  const ALL = `รวมทุกชีต (${parts.length} ชีต)`;
  const src = makeSource('fin', fileName, {sheetNames: [ALL, ...wbData.sheetNames], sheets: {...wbData.sheets, [ALL]: rows}});
  src.combinedSheet = ALL; src.sheetCount = parts.length;
  return src;
}
function looksLikeFinance(wbData){
  const src = makeSource('master', '', wbData);
  return src.map.level < 0 && src.map.dept < 0 && autoMap('fin', headersOf(src)).amount >= 0;
}

/* ---------- normalising ---------- */
const normId = v => String(v||'').replace(/[\s\-'.]/g,'').replace(/^0+/,'').toUpperCase();
const PREFIX = /^(นางสาว|นาง|นาย|น\.ส\.|นส\.|ด\.ช\.|ด\.ญ\.|เด็กชาย|เด็กหญิง|mr\.?|mrs\.?|ms\.?|miss)\s*/i;
const normName = v => String(v||'').trim().replace(PREFIX,'').replace(/\s+/g,'').toLowerCase();
const num = v => { const n = parseFloat(String(v).replace(/[^\d.\-]/g,'')); return isNaN(n) ? 0 : n; };
const normNid = v => String(v||'').replace(/\D/g,'');
const cleanNum = v => String(v ?? '').trim().replace(/\.0+$/,'');
const tidy = v => String(v ?? '').replace(/\s+/g,' ').trim();
const keyOf = (s, by) => by === 'id' ? normId(s.id) : by === 'nid' ? normNid(s.nid) : normName(s.name);

/* RMS "รายงานรายชื่อนักเรียนนักศึกษาแยกตามกลุ่ม": one sheet per class group,
   level/group in "ชั้นปี" (e.g. ปวช.1/3), department in "ชื่อกลุ่มเรียน", students below the "รหัสประจำตัว" header */
function isRms(wbData){
  return wbData.sheetNames.some(n => (wbData.sheets[n] || []).slice(0, 20).some(r => r.some(v => tidy(v) === 'รหัสกลุ่มเรียน')));
}
function parseRms(wbData){
  const list = []; let sheets = 0, skipped = 0;
  wbData.sheetNames.forEach(n => {
    let code = '', dept = '', cls = '', cols = null;
    (wbData.sheets[n] || []).forEach(row => {
      const c = row.map(tidy);
      const after = lab => { const k = c.indexOf(lab); if (k < 0) return ''; for (let j = k + 1; j < c.length; j++) if (c[j]) return c[j]; return ''; };
      if (c.includes('รหัสกลุ่มเรียน')){ code = cleanNum(after('รหัสกลุ่มเรียน')); dept = after('ชื่อกลุ่มเรียน'); cols = null; return; }
      if (c.includes('ชั้นปี')){ cls = after('ชั้นปี'); return; }
      if (c.includes('รหัสประจำตัว')){
        cols = {id:c.indexOf('รหัสประจำตัว'), nid:c.indexOf('รหัสประชาชน'), name:c.indexOf('ชื่อ - สกุล'), type:c.indexOf('ประเภทผู้เรียน')};
        if (cols.name < 0) cols.name = c.findIndex(v => /ชื่อ/.test(v));
        sheets++; return;
      }
      if (!cols) return;
      const id = cleanNum(c[cols.id]);
      if (!id) return;
      if (!/^\d+$/.test(id)){ skipped++; return; }
      const m = cls.match(/^(.+?)\s*\/\s*(\S+)$/);
      list.push({
        id, name: c[cols.name] || '',
        level: m ? m[1] : (cls || '(ไม่ระบุชั้น)'), group: m ? m[2] : '-',
        dept: normDept(dept) || '(ไม่ระบุสาขา)',
        nid: cols.nid >= 0 ? cleanNum(c[cols.nid]) : '', type: cols.type >= 0 ? (c[cols.type] || '') : '', code
      });
    });
  });
  return {list, sheets, skipped};
}
function dedupe(list){
  const seen = new Map(), out = []; let dup = 0;
  list.forEach(s => { const k = normId(s.id); if (seen.has(k)){ dup++; out[seen.get(k)] = s; } else { seen.set(k, out.length); out.push(s); } });
  return {list: out, dup};
}
/* Students from an imported roster → [{id,name,level,dept,group,nid,type,code}] */
function studentsFromSource(src){
  if (src.rms){ const d = dedupe(src.rms.list); return {missing:[], list:d.list, skipped:src.rms.skipped, dup:d.dup}; }
  const m = src.map, raw = [];
  let skipped = 0;
  const missing = FIELDS.master.filter(f => f.req && !(m[f.k] >= 0)).map(f => f.label);
  if (missing.length) return {missing, list:[], skipped, dup:0};
  dataRows(src).forEach(({r}) => {
    const id = cleanNum(r[m.id]);
    const name = [r[m.name] || '', m.surname >= 0 ? (r[m.surname] || '') : ''].join(' ').replace(/\s+/g,' ').trim();
    if (!normId(id) || !/\d/.test(id)){ skipped++; return; }
    raw.push({id, name, level: tidy(r[m.level]) || '(ไม่ระบุชั้น)', dept: normDept(r[m.dept]) || '(ไม่ระบุสาขา)', group: m.group >= 0 ? (tidy(r[m.group]) || '-') : '-',
      nid: m.nid >= 0 ? cleanNum(r[m.nid]) : '', type: m.type >= 0 ? tidy(r[m.type]) : '', code: ''});
  });
  const d = dedupe(raw);
  return {missing, list:d.list, skipped, dup:d.dup};
}
const toArr = s => [s.id, s.name, s.level, s.dept, s.group, s.nid || '', s.type || '', s.code || ''];
const fromArr = a => ({id:a[0], name:a[1], level:a[2], dept:a[3], group:a[4], nid:a[5] || '', type:a[6] || '', code:a[7] || ''});
const payKey = id => 'c' + (String(id).replace(/[^0-9A-Za-z]/g,'').slice(0, 7) || '0');

/* ---------- finance matching ---------- */
function planFinance(){
  const fin = S.fin, roster = V().students;
  if (!fin) return null;
  if (!roster.length) return {error:'ยังไม่มีรายชื่อนักศึกษาในระบบ', hint:'กด "นำเข้ารายชื่อจาก RMS" ด้านบนก่อน แล้วค่อยประมวลผลไฟล์การเงิน'};
  const fm = fin.map, by = S.matchBy;
  if (!(fm[by] >= 0)) return {error:`หาคอลัมน์ "${MATCH_LABEL[by]}" ในไฟล์การเงินไม่เจอ`, hint:'กด "ปรับชีตและคอลัมน์เอง" เพื่อเลือกคอลัมน์ หรือเปลี่ยนวิธีจับคู่'};
  const index = new Map();
  roster.forEach(s => { const k = keyOf(s, by); if (k) index.set(k, s); });
  const combined = fin.combinedSheet && fin.sheet === fin.combinedSheet;
  const hit = new Map(), unmatched = [];
  let rows = 0;
  dataRows(fin).forEach(({r, line}) => {
    const g = k => fm[k] >= 0 ? (r[fm[k]] ?? '') : '';
    const key = keyOf({id:g('id'), name:g('name'), nid:g('nid')}, by);
    if (!key) return;
    if (by !== 'name' && !/\d/.test(key)) return;          // subtotal / note rows
    if (by === 'nid' && key.length !== 13) return;
    rows++;
    const amount = num(g('amount')), rc = cleanNum(g('rc')), dt = tidy(g('dt'));
    const where = combined ? `ชีต ${r[0]} แถว ${r[1]}` : `แถว ${line}`;
    const s = index.get(key);
    if (!s){ unmatched.push({id:tidy(g('id')), name:tidy(g('name')), amount, rc, where}); return; }
    const h = hit.get(s.id) || {amt:0, rc:[], dt:[], times:0};
    h.amt += amount; h.times++;
    if (rc && !h.rc.includes(rc)) h.rc.push(rc);
    if (dt && !h.dt.includes(dt)) h.dt.push(dt);
    hit.set(s.id, h);
  });
  return {rows, hit, unmatched, sheets: combined ? fin.sheetCount : 1};
}

/* ---------- storage: artifact database or this browser ---------- */
let db = null, downloads = null, loadedV = null, loadedRev = null, loadTimer = null;
const LS_KEY = 'registration-fee-sorter.v1';
function boot(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ startLocal(); return; }
  loadTimer = setTimeout(() => { if (S.dbState === 'loading'){ S.dbState = 'timeout'; render(); } }, 10000);
  c.use('downloads').then(d => { downloads = d; }).catch(() => {});
  c.use('user').then(async u => {
    if (!u) return;
    try { S.canWrite = await u.canEdit(); } catch(e){ S.canWrite = null; }
    render();
  }).catch(() => {});
  c.use('db').then(d => {
    if (!d){ clearTimeout(loadTimer); startLocal(); return; }
    db = d; S.mode = 'db';
    db.doc('meta/roster').onSnapshot(snap => {
      if (!snap.exists){
        if (!snap.metadata.fromCache){ clearTimeout(loadTimer); Object.assign(S.data, {meta:null, students:[], chunks:[]}); loadedV = loadedRev = null; S.dbState = 'empty'; render(); }
        return;
      }
      const meta = snap.data(); S.data.meta = meta;
      if (meta.v !== loadedV || (meta.rev || null) !== loadedRev) loadChunks(meta, 0);
      else if (!snap.metadata.fromCache) clearTimeout(loadTimer);
    }, dbFail);
    db.collection('pay').onSnapshot(q => {
      const docs = {}, pay = {};
      q.docs.forEach(d => { const o = d.data() || {}; docs[d.id] = o; Object.keys(o).forEach(id => { pay[id] = o[id]; }); });
      S.data.payDocs = docs; S.data.pay = pay; render();
    }, dbFail);
    db.doc('meta/pay').onSnapshot(snap => { S.data.payMeta = snap.exists ? snap.data() : null; render(); }, dbFail);
  }).catch(() => startLocal());
}
function dbFail(err){ clearTimeout(loadTimer); S.dbState = 'error'; S.dbError = err && err.code; render(); }
async function loadChunks(meta, attempt){
  try {
    const q = await db.collection('roster').where('v', '==', meta.v).get();
    const docs = q.docs.map(d => ({docId:d.id, ...d.data()})).sort((a,b) => a.i - b.i);
    if (docs.length < meta.chunks){
      if (attempt < 2) setTimeout(() => { if (S.data.meta && S.data.meta.v === meta.v) loadChunks(meta, attempt + 1); }, 1500);
      return;
    }
    clearTimeout(loadTimer);
    S.data.chunks = docs.map(d => ({docId:d.docId, i:d.i, s:(d.s || []).slice()}));
    S.data.students = [];
    S.data.chunks.forEach(ch => ch.s.forEach(a => S.data.students.push(fromArr(a))));
    loadedV = meta.v; loadedRev = meta.rev || null; S.dbState = 'ready';
    render();
  } catch(e){
    if (attempt < 1) setTimeout(() => loadChunks(meta, attempt + 1), 1500);
    else dbFail(e);
  }
}
function startLocal(){
  S.mode = 'local';
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (d && Array.isArray(d.students) && d.students.length){
      Object.assign(S.data, {students:d.students, pay:d.pay || {}, meta:d.meta || null, payMeta:d.payMeta || null});
      S.dbState = 'ready'; render(); return;
    }
  } catch(e){}
  S.dbState = 'empty';
  loadSample();
}
function persistLocal(){
  if (S.mode !== 'local' || S.sample) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify({students:S.data.students, pay:S.data.pay, meta:S.data.meta, payMeta:S.data.payMeta})); }
  catch(e){ toast('เบราว์เซอร์นี้บันทึกข้อมูลไม่ได้ ข้อมูลจะหายเมื่อปิดหน้า'); }
}
const useDb = () => S.mode === 'db' && !S.sample && db;
function newMeta(extra){ return {...(V().meta || {}), count:V().students.length, updatedAt:new Date().toISOString(), rev:Date.now().toString(36), ...extra}; }

async function storeRoster(list, fileName){
  const D = V();
  if (useDb()){
    const v = Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    const n = Math.max(1, Math.ceil(list.length / CHUNK)), col = db.collection('roster'), chunks = [];
    for (let i = 0; i < n; i++){
      S.saving = {done:i, total:n}; renderImportPreview();
      const ch = {docId:`${v}-${String(i).padStart(3,'0')}`, i, s:list.slice(i * CHUNK, (i + 1) * CHUNK).map(toArr)};
      await col.doc(ch.docId).set({v, i, s:ch.s});
      chunks.push(ch);
    }
    const meta = {v, count:list.length, chunks:n, updatedAt:new Date().toISOString(), fileName, rev:v};
    await db.doc('meta/roster').set(meta);
    try { const old = await col.where('v', '!=', v).get(); for (const d of old.docs) await col.doc(d.id).delete(); } catch(e){}
    Object.assign(D, {students:list, chunks, meta}); loadedV = v; loadedRev = v; S.dbState = 'ready';
  } else {
    Object.assign(D, {students:list, meta:{count:list.length, updatedAt:new Date().toISOString(), fileName}});
    if (!S.sample) S.dbState = 'ready';
    persistLocal();
  }
}
/* add or replace one student; chunk-level write in the database */
async function storeStudent(stu){
  const D = V(), i = D.students.findIndex(s => s.id === stu.id);
  if (i >= 0) D.students[i] = stu; else D.students.push(stu);
  if (useDb()){
    if (!D.meta || !D.chunks.length){ await storeRoster(D.students.slice(), 'เพิ่มทีละคน'); return; }
    let ch = D.chunks.find(c => c.s.some(a => a[0] === stu.id)), newChunk = false;
    if (ch) ch.s = ch.s.map(a => a[0] === stu.id ? toArr(stu) : a);
    else {
      ch = D.chunks[D.chunks.length - 1];
      if (ch.s.length >= CHUNK){ ch = {docId:`${D.meta.v}-${String(D.chunks.length).padStart(3,'0')}`, i:D.chunks.length, s:[]}; D.chunks.push(ch); newChunk = true; }
      ch.s.push(toArr(stu));
    }
    await db.collection('roster').doc(ch.docId).set({v:D.meta.v, i:ch.i, s:ch.s});
    const meta = newMeta(newChunk ? {chunks:D.chunks.length} : {});
    await db.doc('meta/roster').set(meta); D.meta = meta; loadedRev = meta.rev;
  } else { D.meta = newMeta(); persistLocal(); }
}
async function removeStudent(id){
  const D = V();
  D.students = D.students.filter(s => s.id !== id);
  if (useDb()){
    const ch = D.chunks.find(c => c.s.some(a => a[0] === id));
    if (ch){ ch.s = ch.s.filter(a => a[0] !== id); await db.collection('roster').doc(ch.docId).set({v:D.meta.v, i:ch.i, s:ch.s}); }
    const meta = newMeta(); await db.doc('meta/roster').set(meta); D.meta = meta; loadedRev = meta.rev;
  } else { D.meta = newMeta(); persistLocal(); }
  if (D.pay[id]) await storePay({[id]: null});
}
/* changes: {studentId: entry | null} */
async function storePay(changes){
  const D = V(), byKey = {};
  Object.keys(changes).forEach(id => { (byKey[payKey(id)] = byKey[payKey(id)] || []).push(id); });
  Object.keys(changes).forEach(id => { if (changes[id]) D.pay[id] = changes[id]; else delete D.pay[id]; });
  if (useDb()){
    const keys = Object.keys(byKey);
    for (let k = 0; k < keys.length; k++){
      const key = keys[k], doc = {...(D.payDocs[key] || {})};
      byKey[key].forEach(id => { if (changes[id]) doc[id] = changes[id]; else delete doc[id]; });
      if (keys.length > 3){ S.busy = `กำลังบันทึก ${k + 1}/${keys.length}`; renderFinPreview(); }
      if (Object.keys(doc).length) await db.collection('pay').doc(key).set(doc);
      else if (D.payDocs[key]) await db.collection('pay').doc(key).delete();
      D.payDocs[key] = doc;
    }
  } else persistLocal();
}
async function storePayMeta(m){
  V().payMeta = m;
  if (useDb()) await db.doc('meta/pay').set(m); else persistLocal();
}
async function clearPayAll(){
  const D = V();
  if (useDb()){
    for (const key of Object.keys(D.payDocs)) await db.collection('pay').doc(key).delete();
    await db.doc('meta/pay').delete();
  }
  Object.assign(D, {pay:{}, payDocs:{}, payMeta:null}); persistLocal();
}
async function clearEverything(){
  const D = V();

  if (useDb()){
    for (const ch of D.chunks) await db.collection('roster').doc(ch.docId).delete();
    await db.doc('meta/roster').delete();
    loadedV = loadedRev = null;

  Object.assign(D, {students:[], chunks:[], meta:null});

function importPlan(){
  if (!S.master) return null;
  const r = studentsFromSource(S.master);
  if (r.missing.length) return {...r};
  const cur = V().students;
  const mode = cur.length && $('#mode-merge').checked ? 'merge' : 'replace';
  if (mode === 'replace') return {...r, mode, final:r.list, added:r.list.length, updated:0};
  const map = new Map(cur.map(s => [normId(s.id), s]));
  let added = 0, updated = 0;
  r.list.forEach(s => { const k = normId(s.id); if (map.has(k)) updated++; else added++; map.set(k, s); });
  return {...r, mode, final:[...map.values()], added, updated};
}

  const noNid = p.list.filter(s => !s.nid).length;

  btn.disabled = false;
  if (S.confirmReplace){ btn.textContent = `ยืนยันแทนที่ด้วย ${fmt(p.final.length)} คน`; btn.className = 'btn danger'; }
}

/* ---------- export ---------- */
function sheetName(raw, used){
  let base = String(raw).replace(/[:\\\/?*\[\]]/g,' ').replace(/\s+/g,' ').trim().slice(0,31) || 'Sheet';
  let n = base, i = 2;
  while (used.has(n.toLowerCase())){ const suf = ' (' + i++ + ')'; n = base.slice(0, 31 - suf.length) + suf; }
  used.add(n.toLowerCase()); return n;
}
function buildWorkbook(){
  const D = V(), list = filtered(), G = groupsOf(list), wb = XLSX.utils.book_new(), used = new Set();
  const row = (s, i) => { const p = D.pay[s.id] || {}; return [i + 1, s.id, s.name, `${s.level}/${s.group}`, s.dept, s.nid || '', s.type || '', STATUS[stOf(s)].t, p.rc || '', p.dt || '', p.amt || '', p.note || '']; };
  const head = ['ที่','รหัสนักศึกษา','ชื่อ-สกุล','ห้อง','สาขาวิชา','เลขประจำตัวประชาชน','ประเภท','สถานะ','เลขที่ใบเสร็จ','วันที่ชำระ','จำนวนเงิน (บาท)','หมายเหตุ'];
  const cols = [{wch:5},{wch:13},{wch:28},{wch:10},{wch:24},{wch:16},{wch:9},{wch:11},{wch:14},{wch:18},{wch:12},{wch:20}];
  const add = (name, aoa, c) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = c; XLSX.utils.book_append_sheet(wb, ws, sheetName(name, used)); };
  const sum = [['ระดับชั้น','สาขาวิชา','ทั้งหมด','ชำระแล้ว','ผ่อนผัน','ยังไม่ชำระ','ร้อยละที่ชำระ','ยอดเงิน (บาท)']];
  G.forEach(g => sum.push([g.level, g.dept, g.list.length, g.paid, g.deferred, g.unpaid, pctOf(g.paid, g.list.length), g.amt]));
  add('สรุป', sum, [{wch:10},{wch:28},{wch:9},{wch:9},{wch:9},{wch:10},{wch:12},{wch:14}]);
  G.forEach(g => add(`${g.level} ${g.dept}`, [[`${g.level} ${g.dept}`], [], head, ...g.list.map(row)], cols));
  add('ยังไม่ชำระ', [head, ...list.filter(s => stOf(s) === 'unpaid').map(row)], cols);
  add('ผ่อนผัน', [head, ...list.filter(s => stOf(s) === 'deferred').map(row)], cols);
  const U = (D.payMeta && D.payMeta.unmatched) || [];
  add('ไม่พบในรายชื่อ', [['ตำแหน่งในไฟล์การเงิน','รหัสที่กรอก','ชื่อ-สกุล','เลขที่ใบเสร็จ','จำนวนเงิน (บาท)'], ...U.map(u => [u.where, u.id, u.name, u.rc || '', u.amount])], [{wch:26},{wch:14},{wch:28},{wch:14},{wch:14}]);
  return wb;
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 4500); }
async function exportXlsx(){
  if (!V().students.length){ toast('ยังไม่มีข้อมูลให้ดาวน์โหลด'); return; }
  const wb = buildWorkbook(), d = new Date();
  const filename = `สรุปค่าลงทะเบียน_${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()+543}.xlsx`;
  if (downloads){
    try { const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'}); await downloads.save({filename, data:new Blob([buf])}); toast('บันทึกไฟล์แล้ว: ' + filename); }
    catch(e){ toast(e && e.code === 'declined' ? 'ยกเลิกการบันทึกไฟล์' : 'บันทึกไฟล์ไม่สำเร็จ ลองอีกครั้ง'); }
  } else {
    try { XLSX.writeFile(wb, filename); toast('กำลังดาวน์โหลด ' + filename); } catch(e){ toast('ดาวน์โหลดไม่ได้ในหน้านี้'); }
  }
}

async function loadRoster(files){
  files = [...(files || [])];
  if (!files.length) return;
  $('#name-master').textContent = `กำลังอ่าน ${files.length} ไฟล์…`;
  const books = [];
  for (const f of files){
    try { books.push({name:f.name, wb:readWorkbook(await f.arrayBuffer())}); }
    catch(e){ toast('เปิดไฟล์ "' + f.name + '" ไม่ได้ ตรวจว่าเป็นไฟล์ Excel หรือ CSV'); renderMaster(); return; }
  }
  const rms = books.filter(b => isRms(b.wb)), other = books.filter(b => !isRms(b.wb));
  if (!rms.length && other.length === 1 && looksLikeFinance(other[0].wb)){
    closeImport(); if (S.sample) leaveSample();
    S.fin = makeFinSource(other[0].name, other[0].wb); renderFinPreview();
    toast('ไฟล์นี้เป็นไฟล์จากฝ่ายการเงิน ย้ายไปช่อง "อัปเดตสถานะชำระเงิน" ให้แล้ว');
    $('#processBtn').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if (rms.length && other.length){ toast('ไฟล์ ' + other.map(b => b.name).join(', ') + ' ไม่ใช่รายงานรายชื่อแยกตามกลุ่มจาก RMS ให้นำเข้าแยกกัน'); renderMaster(); return; }
  if (!rms.length && other.length > 1){ toast('ไฟล์ Excel ทั่วไปนำเข้าได้ทีละไฟล์ (รายงาน RMS เลือกได้หลายไฟล์)'); renderMaster(); return; }
  if (rms.length){
    const all = {list:[], sheets:0, skipped:0};
    rms.forEach(b => { const r = parseRms(b.wb); all.list.push(...r.list); all.sheets += r.sheets; all.skipped += r.skipped; });
    S.master = {fileName: rms.map(b => b.name).join(', '), rms: all};
  } else S.master = makeSource('master', books[0].name, books[0].wb);
  S.confirmReplace = false;
  renderMaster(); renderImportPreview();
}
[['fin', f => loadFinFile(f[0])], ['master', f => loadRoster(f)]].forEach(([kind, handle]) => {
  const input = $('#file-' + kind), drop = $('#drop-' + kind);
  input.onchange = () => { const f = [...input.files]; input.value = ''; handle(f); };
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); handle([...e.dataTransfer.files]); });
});

/* ---------- sample data (fictional, never saved) ---------- */
function makeSample(){
  let seed = 25691118;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pickR = a => a[Math.floor(rnd() * a.length)];
  const fM = ['ธนพล','ณัฐวุฒิ','กิตติศักดิ์','พีรพัฒน์','อนุชา','วรเมธ','ศุภชัย','ชยพล','ธีรภัทร','ภาณุพงศ์','สิทธิชัย','จิรายุ','ปฏิภาณ','รัฐภูมิ','อภิสิทธิ์','ก้องภพ'];
  const fF = ['ณัฐธิดา','พิมพ์ชนก','กัญญาวีร์','ศิริพร','ปวีณา','สุชาดา','ธิดารัตน์','อรอุมา','จิราพร','วรรณิศา','ชลธิชา','กมลชนก'];
  const ln = ['ศรีสุข','บุญมา','แก้วประเสริฐ','ทองดี','พรหมวงศ์','จันทร์หอม','สมบูรณ์ชัย','ไชยมงคล','วงศ์ใหญ่','ภูมิพันธ์','อินทร์แก้ว','ศรีวงษา','คำมูล','พลศักดิ์','บุตรดี','มณีรัตน์','สายทอง','นาคสุวรรณ'];
  const levels = [{lv:'ปวช.1',c:'2',y:'69'},{lv:'ปวช.2',c:'2',y:'68'},{lv:'ปวช.3',c:'2',y:'67'},{lv:'ปวส.1',c:'3',y:'69'},{lv:'ปวส.2',c:'3',y:'68'}];
  const depts = [{n:'ช่างยนต์',c:'0101',f:.05,g:2},{n:'ไฟฟ้า',c:'0104',f:.1,g:2},{n:'อิเล็กทรอนิกส์',c:'0105',f:.2,g:1},{n:'ช่างก่อสร้าง',c:'0106',f:.25,g:1},{n:'เทคนิคคอมพิวเตอร์',c:'1909',f:.45,g:1},{n:'การบัญชี',c:'0201',f:.85,g:1}];
  const students = [], pay = {}, months = ['10 กันยายน 2569','11 กันยายน 2569','14 กันยายน 2569','15 กันยายน 2569','16 กันยายน 2569'];
  let rc = 690151900;
  levels.forEach(L => depts.forEach(D => {
    const groups = L.c === '3' ? 1 : D.g;
    for (let g = 1; g <= groups; g++){
      const n = 6 + Math.floor(rnd() * 6);
      for (let s = 1; s <= n; s++){
        const female = rnd() < D.f;
        const id = `${L.y}${L.c}${D.c}${String(g * 100 + s).padStart(4,'0')}`;
        students.push({id, name:`${female ? 'นางสาว' : 'นาย'}${female ? pickR(fF) : pickR(fM)}  ${pickR(ln)}`.replace(/\s+/g,' '), level:L.lv, dept:D.n, group:String(g), nid:'', type: rnd() < .15 ? 'ทวิภาคี' : 'ปกติ', code:''});
        const r = rnd();
        if (r < 0.72) pay[id] = {st:'paid', rc:String(rc++), dt:pickR(months), amt: L.c === '2' ? 1100 : 2700, note:'', src:'file', at:''};
        else if (r < 0.8) pay[id] = {st:'deferred', rc:'', dt:'', amt:0, note:'ผ่อนผันถึง 30 ก.ย. 2569', src:'manual', at:''};
      }
    }
  }));
  const payMeta = {at:new Date().toISOString(), fileName:'ตัวอย่าง_ค่าลงทะเบียน.xlsx', rows:0, matched:0, unmatchedCount:2,
    unmatched:[{where:'ชีต 14 ก.ย.69 แถว 7', id:'6720101019', name:'นายวีรภัทร ใจดี', rc:'690151947', amount:1100}, {where:'ชีต 15 ก.ย.69 แถว 3', id:'68302010999', name:'นางสาวขวัญข้าว ดวงดี', rc:'690151990', amount:2700}]};
  return {students, pay, payDocs:{}, chunks:[], meta:{updatedAt:new Date().toISOString()}, payMeta};
}

render();
